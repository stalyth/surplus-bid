<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><style>
    .bg{fill:#f7f7f5}.panel{fill:#fff;stroke:#232323;stroke-width:2}.soft{fill:#efefec;stroke:#777;stroke-width:1.5}.dark{fill:#232323}.green{fill:#dff4e7;stroke:#26734d;stroke-width:1.5}.blue{fill:#e3eefc;stroke:#386b9c;stroke-width:1.5}.amber{fill:#fff0c7;stroke:#9a6914;stroke-width:1.5}.red{fill:#fbe4e2;stroke:#a63b32;stroke-width:1.5}.title{font:700 34px Arial,"PingFang SC",sans-serif;fill:#171717}.h2{font:700 22px Arial,"PingFang SC",sans-serif;fill:#171717}.body{font:17px Arial,"PingFang SC",sans-serif;fill:#252525}.small{font:14px Arial,"PingFang SC",sans-serif;fill:#555}.mono{font:15px Menlo,monospace;fill:#252525}.white{fill:#fff}.line{stroke:#232323;stroke-width:2;fill:none}.dash{stroke:#777;stroke-width:1.5;stroke-dasharray:7 7;fill:none}
  </style></defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="panel" x="35" y="28" width="1370" height="78" rx="16"/>
  <text class="title" x="70" y="78">SurplusBid</text><text class="small" x="1250" y="60">Concordium</text><text class="body" x="1250" y="84">TESTNET</text>
  <g transform="translate(480 55)"><circle cx="0" cy="0" r="17" class="green"/><text class="small" x="-4" y="5">✓</text><line x1="17" y1="0" x2="92" y2="0" class="line"/><circle cx="110" cy="0" r="17" class="green"/><text class="small" x="106" y="5">✓</text><line x1="127" y1="0" x2="202" y2="0" class="line"/><circle cx="220" cy="0" r="17" class="green"/><text class="small" x="216" y="5">✓</text><line x1="237" y1="0" x2="312" y2="0" class="line"/><circle cx="330" cy="0" r="17" class="dark"/><text class="white small" x="326" y="5">4</text></g>
  <text class="title" x="55" y="162">04 · 证据：用同一个 auction ID 独立核验</text>

  <rect class="panel" x="55" y="195" width="750" height="430" rx="18"/>
  <text class="h2" x="80" y="235">交易时间线</text>
  <rect class="amber" x="80" y="255" width="700" height="48" rx="10"/><text class="small" x="100" y="285">Auction ID · 待完成新费用规则与双买家 Testnet 验证后填入</text>
  <line class="line" x1="120" y1="345" x2="120" y2="570"/>
  <g>
    <circle cx="120" cy="355" r="14" class="green"/><text class="h2" x="155" y="362">创建拍卖</text><text class="mono" x="360" y="362">tx: 待填写</text><rect class="soft" x="650" y="332" width="105" height="38" rx="8"/><text class="small" x="670" y="356">Explorer ↗</text>
    <circle cx="120" cy="420" r="14" class="green"/><text class="h2" x="155" y="427">Buyer A 报价</text><text class="mono" x="360" y="427">tx: 待填写</text><rect class="soft" x="650" y="397" width="105" height="38" rx="8"/><text class="small" x="670" y="421">Explorer ↗</text>
    <circle cx="120" cy="485" r="14" class="green"/><text class="h2" x="155" y="492">Buyer B 报价</text><text class="mono" x="360" y="492">tx: 待填写</text><rect class="soft" x="650" y="462" width="105" height="38" rx="8"/><text class="small" x="670" y="486">Explorer ↗</text>
    <circle cx="120" cy="550" r="14" class="green"/><text class="h2" x="155" y="557">最终结算</text><text class="mono" x="360" y="557">tx: 待填写</text><rect class="dark" x="650" y="527" width="105" height="38" rx="8"/><text class="white small" x="670" y="551">Explorer ↗</text>
  </g>

  <rect class="panel" x="830" y="195" width="555" height="430" rx="18"/>
  <text class="h2" x="855" y="235">合约最终状态</text>
  <g transform="translate(855 265)">
    <rect class="soft" width="240" height="75" rx="10"/><text class="small" x="18" y="28">状态</text><text class="h2" x="18" y="57">Finalized</text>
    <rect class="green" x="260" width="240" height="75" rx="10"/><text class="small" x="278" y="28">赢家</text><text class="h2" x="278" y="57">Buyer B</text>
    <rect class="soft" y="95" width="240" height="75" rx="10"/><text class="small" x="18" y="123">成交价</text><text class="h2" x="18" y="152">4 CCD</text>
    <rect class="amber" x="260" y="95" width="240" height="75" rx="10"/><text class="small" x="278" y="123">平台费</text><text class="h2" x="278" y="152">0.4 CCD</text>
    <rect class="green" y="190" width="240" height="75" rx="10"/><text class="small" x="18" y="218">合约余额</text><text class="h2" x="18" y="247">0 CCD</text>
    <rect class="red" x="260" y="190" width="240" height="75" rx="10"/><text class="small" x="278" y="218">再次 Finalize</text><text class="h2" x="278" y="247">Rejected</text>
  </g>
  <text class="small" x="855" y="566">页面数据 = 合约 view = CCDExplorer 交易结果</text>
  <rect class="dark" x="855" y="580" width="500" height="28" rx="10"/><text class="white small" x="997" y="599">公开证据，可由评委复核</text>

  <rect class="panel" x="55" y="660" width="650" height="180" rx="16"/>
  <text class="h2" x="80" y="700">想让评委相信什么</text>
  <text class="body" x="80" y="738">页面不是唯一结果来源；完整流程可以从公开链上证据复核。</text>
  <text class="small" x="80" y="780">规则、报价顺序、结算和余额都关联同一个 auction ID</text>
  <path class="dash" d="M80 807 H650"/><text class="small" x="80" y="830">重复结算不会造成二次付款</text>
  <rect class="panel" x="735" y="660" width="650" height="180" rx="16"/>
  <text class="h2" x="760" y="700">凭什么相信</text>
  <text class="body" x="760" y="738">CCDExplorer 链接、合约 view、最终余额和拒绝结果一致。</text>
  <text class="small" x="760" y="780">当前图中的新规则交易字段均为待验证占位，不伪造哈希</text>
  <path class="dash" d="M760 807 H1330"/><text class="small" x="760" y="830">x402 集成仍需验证，不在本轮资金证据中</text>
</svg>
