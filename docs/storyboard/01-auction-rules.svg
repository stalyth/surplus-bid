<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#f7f7f5}.panel{fill:#fff;stroke:#232323;stroke-width:2}.soft{fill:#efefec;stroke:#777;stroke-width:1.5}.dark{fill:#232323}.green{fill:#dff4e7;stroke:#26734d;stroke-width:1.5}.amber{fill:#fff0c7;stroke:#9a6914;stroke-width:1.5}.muted{fill:#666}.title{font:700 34px Arial,"PingFang SC",sans-serif;fill:#171717}.h2{font:700 22px Arial,"PingFang SC",sans-serif;fill:#171717}.body{font:17px Arial,"PingFang SC",sans-serif;fill:#252525}.small{font:14px Arial,"PingFang SC",sans-serif;fill:#555}.mono{font:15px Menlo,monospace;fill:#252525}.white{fill:#fff}.line{stroke:#232323;stroke-width:2;fill:none}.dash{stroke:#777;stroke-width:1.5;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="panel" x="35" y="28" width="1370" height="78" rx="16"/>
  <text class="title" x="70" y="78">SurplusBid</text>
  <text class="small" x="1250" y="60">Concordium</text><text class="body" x="1250" y="84">TESTNET</text>
  <g transform="translate(480 55)"><circle cx="0" cy="0" r="17" class="dark"/><text class="white small" x="-4" y="5">1</text><line x1="17" y1="0" x2="92" y2="0" class="line"/><circle cx="110" cy="0" r="17" class="soft"/><text class="small" x="106" y="5">2</text><line x1="127" y1="0" x2="202" y2="0" class="line"/><circle cx="220" cy="0" r="17" class="soft"/><text class="small" x="216" y="5">3</text><line x1="237" y1="0" x2="312" y2="0" class="line"/><circle cx="330" cy="0" r="17" class="soft"/><text class="small" x="326" y="5">4</text></g>

  <text class="title" x="55" y="162">01 · 输入：报价前固定拍卖规则</text>
  <rect class="panel" x="55" y="190" width="465" height="460" rx="18"/>
  <rect class="soft" x="80" y="215" width="415" height="165" rx="12"/>
  <text class="small" x="105" y="248">数字服务</text>
  <text class="h2" x="105" y="284">Priority AI Analysis</text>
  <text class="body" x="105" y="318">当前时间窗口仅可交付一份</text>
  <text class="body" x="105" y="346">高优先级 AI 分析结果</text>
  <circle cx="112" cy="424" r="27" class="dark"/><text class="white body" x="103" y="431">S</text>
  <text class="h2" x="155" y="420">Seller Agent</text>
  <text class="small" x="155" y="446">根据容量与最低接受价格生成参数</text>
  <rect class="green" x="80" y="488" width="140" height="40" rx="20"/><text class="body" x="111" y="514">OPEN</text>
  <text class="small" x="80" y="568">Auction ID</text>
  <rect class="soft" x="80" y="582" width="415" height="44" rx="8"/><text class="mono" x="97" y="610">待新规则 Testnet 验证后填入</text>

  <rect class="panel" x="545" y="190" width="840" height="460" rx="18"/>
  <text class="h2" x="575" y="230">本轮链上规则</text>
  <g transform="translate(575 260)">
    <rect class="soft" width="180" height="78" rx="10"/><text class="small" x="18" y="28">容量</text><text class="h2" x="18" y="58">1 份</text>
    <rect class="soft" x="200" width="180" height="78" rx="10"/><text class="small" x="218" y="28">卖家底价</text><text class="h2" x="218" y="58">2 CCD</text>
    <rect class="soft" x="400" width="180" height="78" rx="10"/><text class="small" x="418" y="28">最多报价</text><text class="h2" x="418" y="58">2 个</text>
    <rect class="soft" x="600" width="180" height="78" rx="10"/><text class="small" x="618" y="28">竞价时长</text><text class="h2" x="618" y="58">固定 5 分钟</text>
  </g>
  <rect class="soft" x="575" y="365" width="780" height="78" rx="10"/>
  <text class="small" x="595" y="391">当前演示定价规则 · 后续可调整，新规则只作用于新拍卖</text>
  <text class="mono" x="595" y="424">price = reserve + floor((winningBid - reserve) / 2)</text>
  <rect class="amber" x="575" y="463" width="780" height="86" rx="10"/>
  <text class="small" x="595" y="491">平台费规则</text>
  <text class="body" x="595" y="522">交易剩余的 10%，买卖双方均摊；剩余 &lt; 成交价的 10% 时免收</text>
  <rect class="dark" x="575" y="574" width="210" height="48" rx="10"/><text class="white body" x="617" y="604">查看创建交易</text>
  <rect class="green" x="795" y="574" width="180" height="48" rx="10"/><text class="body" x="846" y="604">提交报价</text>
  <rect class="soft" x="985" y="574" width="180" height="48" rx="10"/><text class="muted body" x="1019" y="604">结算（未到期）</text>

  <rect class="panel" x="55" y="680" width="650" height="165" rx="16"/>
  <text class="h2" x="80" y="720">想让评委相信什么</text>
  <text class="body" x="80" y="758">拍卖规则先于报价确定，平台不能在看到报价后临时修改。</text>
  <path class="line" d="M80 793 H650"/><text class="small" x="80" y="822">规则固定 → 买家才能可信地参与</text>
  <rect class="panel" x="735" y="680" width="650" height="165" rx="16"/>
  <text class="h2" x="760" y="720">凭什么相信</text>
  <text class="body" x="760" y="758">创建交易已确认；页面从同一个合约实例读回规则。</text>
  <path class="line" d="M760 793 H1330"/><text class="small" x="760" y="822">创建交易 + 合约 view + 同一个 auction ID</text>
</svg>
