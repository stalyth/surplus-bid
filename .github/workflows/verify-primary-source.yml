name: Rebuild primary Testnet module from source

on:
  push:
    paths:
      - scripts/fetch-primary-module.mjs
      - .github/workflows/verify-primary-source.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the module used by primary instance from Testnet
        run: node scripts/fetch-primary-module.mjs --out "$RUNNER_TEMP/primary-onchain.wasm.v1"
      - name: Rebuild the contract from this checkout
        working-directory: contracts/sealed-auction
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          curl -fL --retry 3 --retry-all-errors \
            'https://github.com/Concordium/concordium-smart-contract-tools/releases/download/releases%2Fcargo-concordium%2F4.2.0/cargo-concordium-linux-amd64' \
            -o "$RUNNER_TEMP/cargo-concordium"
          install -m 755 "$RUNNER_TEMP/cargo-concordium" "$HOME/.cargo/bin/cargo-concordium"
          cargo concordium build --out "$RUNNER_TEMP/primary-rebuilt.wasm.v1" \
            --schema-out "$RUNNER_TEMP/primary-schema.bin" -- --locked
      - name: Compare fresh build with the primary instance's on-chain module
        run: |
          sha256sum "$RUNNER_TEMP/primary-onchain.wasm.v1" "$RUNNER_TEMP/primary-rebuilt.wasm.v1"
          cmp "$RUNNER_TEMP/primary-onchain.wasm.v1" "$RUNNER_TEMP/primary-rebuilt.wasm.v1"
