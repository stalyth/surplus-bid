name: Verify deployed module against published source

on:
  push:
    paths:
      - scripts/verify-onchain-module.mjs
      - .github/workflows/verify-onchain-module.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare finalized Testnet module with the published release
        run: node scripts/verify-onchain-module.mjs --out "$RUNNER_TEMP/module.wasm.v1"
      - name: Rebuild published source and compare with the chain module
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          curl -fL --retry 3 --retry-all-errors \
            'https://github.com/Concordium/concordium-smart-contract-tools/releases/download/releases%2Fcargo-concordium%2F4.2.0/cargo-concordium-linux-amd64' \
            -o "$RUNNER_TEMP/cargo-concordium"
          install -m 755 "$RUNNER_TEMP/cargo-concordium" "$HOME/.cargo/bin/cargo-concordium"
          cargo concordium print-build-info --module "$RUNNER_TEMP/module.wasm.v1"
          cargo concordium verify-build --module "$RUNNER_TEMP/module.wasm.v1"
