name: Diagnose primary module on macOS Intel

on:
  push:
    paths:
      - .github/workflows/verify-primary-macos.yml
  workflow_dispatch:

jobs:
  compare:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch primary module from Testnet
        run: node scripts/fetch-primary-module.mjs --out "$RUNNER_TEMP/primary-onchain.wasm.v1"
      - name: Rebuild with the original macOS toolchain
        working-directory: contracts/sealed-auction
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          curl -fL --retry 3 --retry-all-errors \
            'https://github.com/Concordium/concordium-smart-contract-tools/releases/download/releases%2Fcargo-concordium%2F4.2.0/cargo-concordium-darwin-amd64' \
            -o "$RUNNER_TEMP/cargo-concordium"
          install -m 755 "$RUNNER_TEMP/cargo-concordium" "$HOME/.cargo/bin/cargo-concordium"
          cargo concordium --version
          cargo concordium build --out "$RUNNER_TEMP/primary-rebuilt.wasm.v1" \
            --schema-out "$RUNNER_TEMP/primary-schema.bin" -- --locked
      - name: Compare on-chain and rebuilt bytes
        run: |
          shasum -a 256 "$RUNNER_TEMP/primary-onchain.wasm.v1" "$RUNNER_TEMP/primary-rebuilt.wasm.v1"
          cmp "$RUNNER_TEMP/primary-onchain.wasm.v1" "$RUNNER_TEMP/primary-rebuilt.wasm.v1"
