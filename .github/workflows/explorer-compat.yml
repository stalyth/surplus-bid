name: Check Explorer verifier compatibility

on:
  push:
    paths:
      - .github/workflows/explorer-compat.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the deployed module
        run: |
          curl -fL --retry 3 --retry-all-errors \
            https://github.com/stalyth/surplus-bid/releases/download/verifiable-v3-3cbea1429e6c-42352242563-1/module.wasm.v1 \
            -o module.wasm.v1
          sha256sum module.wasm.v1

      - name: Inspect CCDExplorer's verifier tool image
        run: |
          docker run --rm --entrypoint /bin/sh sderuiter/concordium-tools:8.0.0 -c '
            command -v cargo || true
            cargo --version || true
            command -v rustc || true
            command -v docker || true
            ls -l /usr/local/bin/cargo* || true
          '

      - name: Attempt verification in the tool image
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            sderuiter/concordium-tools:8.0.0 \
            concordium verify-build --module module.wasm.v1
